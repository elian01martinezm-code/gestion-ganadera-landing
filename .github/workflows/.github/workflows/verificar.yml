name: Verificación de Estructura del Proyecto

on:
  push:
    branches:
      - main

jobs:
  validar-archivos:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar archivo index.html
        run: test -f index.html

      - name: Verificar archivo css/style.css
        run: test -f css/style.css

      - name: Verificar archivo js/script.js
        run: test -f js/script.js

      - name: Reportar Éxito
        run: echo "¡Todos los archivos de la sesión existen correctamente!"
